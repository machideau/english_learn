<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="inner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#431407" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#inner)"/>
  <rect x="32" y="32" width="448" height="448" rx="112" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Sound wave arcs -->
  <path d="M 360 216 A 64 64 0 0 1 360 296" fill="none" stroke="#fed7aa" stroke-width="16" stroke-linecap="round" stroke-opacity="0.9"/>
  <path d="M 396 186 A 110 110 0 0 1 396 326" fill="none" stroke="#fed7aa" stroke-width="16" stroke-linecap="round" stroke-opacity="0.6"/>
  <path d="M 152 216 A 64 64 0 0 0 152 296" fill="none" stroke="#fed7aa" stroke-width="16" stroke-linecap="round" stroke-opacity="0.9"/>
  <path d="M 116 186 A 110 110 0 0 0 116 326" fill="none" stroke="#fed7aa" stroke-width="16" stroke-linecap="round" stroke-opacity="0.6"/>

  <!-- Microphone Icon in Center -->
  <g fill="#ffffff" filter="url(#shadow)">
    <!-- Mic Capsule -->
    <rect x="220" y="148" width="72" height="136" rx="36" fill="#ffffff"/>
    <!-- Mic Cradle -->
    <path d="M 188 236 C 188 300 220 324 256 324 C 292 324 324 300 324 236" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>
    <!-- Mic Stem -->
    <line x1="256" y1="324" x2="256" y2="368" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>
    <!-- Mic Base -->
    <line x1="212" y1="368" x2="300" y2="368" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>
  </g>

  <!-- Sparkle Star in Top Right -->
  <path d="M 380 96 L 392 128 L 424 140 L 392 152 L 380 184 L 368 152 L 336 140 L 368 128 Z" fill="#fef08a"/>
</svg>
